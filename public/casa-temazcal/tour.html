button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--copal);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--copal)}

  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}

#hud::before{content:"";position:absolute;inset:0 0 -40px 0;background:linear-gradient(to bottom,rgba(12,10,8,.62),rgba(12,10,8,0));pointer-events:none;z-index:-1}

.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.4vw,34px);line-height:1.05;text-wrap:balance}

.ptbtn[aria-pressed="true"]{background:var(--copal);color:#1a120a;border-color:var(--copal)}

  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--ink);pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

@media (max-width:640px){
  .seg button{padding:6px 8px;font-size:11.5px}
  #mini{width:112px}
  .brand .meta{font-size:12px}
}
@media (prefers-reduced-motion:reduce){#fade,#hint,#intro{transition:none}}

  <span class="eyebrow">Recorrido virtual del proyecto</span>
  <h2>Santo Remedio <em>Temazcal</em></h2>

  <button id="skip">Saltar intro</button>
</div>
<div id="fade"></div>
