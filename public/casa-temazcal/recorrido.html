import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ============ PARÁMETROS (medidas en metros, según planos) ============ */
const LOT_W = 20.00, LOT_D = 15.35;
const H_PB = 2.80, SLAB = 0.20, H_PA = 2.80;          // alturas propuestas (no vienen en planos)
const Z_PA = H_PB + SLAB;                              // 3.00 nivel planta alta
const H_FACH = 3.40, H_BARDA = 3.00;
// Ejes X. Casa: cotas de plano. Patio: cotas ajustadas para sumar 10.00 m.
const PK = 10 / (2.82 + 2.69 + 2.69 + 2.93);
const AX = { A:0, B:3, C:6, Cp:7, D:8.88, Dp:10 };
AX.E = 10 + 2.82*PK; AX.F = AX.E + 2.69*PK; AX.G = AX.F + 2.69*PK; AX.H = 20;
const AY = [0, 3.07, 6.14, 9.21, 12.28, 15.35];         // ejes 1..6

/* ============ RENDER BASE ============ */
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture');
if (CAPTURE) document.body.classList.add('capture');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 1, 0.05, 4000);

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (a, b, t) => { const k = clamp((t - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeOut = k => 1 - Math.pow(1 - k, 3);
const W = x => x - LOT_W / 2, Zc = y => LOT_D / 2 - y;   // plano -> mundo

/* ============ TEXTURAS PROCEDURALES (sin imágenes con derechos) ============ */
function tex(size, draw, rep = 1) {

}
function grain(g, s, amp) { const d = g.getImageData(0, 0, s, s), a = d.data; for (let i = 0; i < a.length; i += 4) { const n = (rnd() - .5) * amp; a[i] += n; a[i + 1] += n; a[i + 2] += n; } g.putImageData(d, 0, 0); }
function blotch(g, s, n, cols, rMin, rMax, alpha) { for (let i = 0; i < n; i++) { g.globalAlpha = alpha; g.fillStyle = cols[(rnd() * cols.length) | 0]; const x = rnd() * s, y = rnd() * s, r = rMin + rnd() * (rMax - rMin); for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) { g.beginPath(); g.arc(x + ox, y + oy, r, 0, 7); g.fill(); } } g.globalAlpha = 1; }
function stones(g, s, mortar, pal, n, rw, rh) {
  g.fillStyle = mortar; g.fillRect(0, 0, s, s);

    const cx = rnd() * s, cy = rnd() * s, w = rw[0] + rnd() * (rw[1] - rw[0]), h = rh[0] + rnd() * (rh[1] - rh[0]);
    const col = pal[(rnd() * pal.length) | 0], pts = [];

      g.beginPath(); pts.forEach(([px, py], k) => k ? g.lineTo(cx + ox + px, cy + oy + py) : g.moveTo(cx + ox + px, cy + oy + py)); g.closePath();
      const gr = g.createLinearGradient(cx + ox - w, cy + oy - h, cx + ox + w, cy + oy + h); gr.addColorStop(0, col); gr.addColorStop(1, shade(col, -22));

}
function shade(hex, d) { const n = parseInt(hex.slice(1), 16); const r = clamp((n >> 16) + d, 0, 255), gg = clamp(((n >> 8) & 255) + d, 0, 255), b = clamp((n & 255) + d, 0, 255); return `rgb(${r},${gg},${b})`; }

const T = {
  stucco: tex(512, (g, s) => { g.fillStyle = '#d2c6b3'; g.fillRect(0, 0, s, s); blotch(g, s, 240, ['#c8bba6', '#dad0bf', '#c2b39c', '#cdbfaa'], 6, 60, .2); grain(g, s, 20); }),
  stuccoW: tex(256, (g, s) => { g.fillStyle = '#eee7dc'; g.fillRect(0, 0, s, s); grain(g, s, 8); }),
  stone: tex(512, (g, s) => { g.fillStyle = '#5e5245'; g.fillRect(0, 0, s, s); let y = 0; while (y < s) { const h = 14 + rnd() * 22; let x = -rnd() * 60; while (x < s) { const w = 34 + rnd() * 70; const col = ['#b8a183', '#a68c6e', '#c9b495', '#957f66', '#bca582', '#a69886', '#c2a27c', '#8e7a64'][(rnd() * 8) | 0]; const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, shade(col, 14)); gr.addColorStop(1, shade(col, -18)); g.fillStyle = gr; g.beginPath(); const j = () => (rnd() - .5) * 4; g.moveTo(x + 2 + j(), y + 2 + j()); g.lineTo(x + w - 2 + j(), y + 2 + j()); g.lineTo(x + w - 2 + j(), y + h - 2 + j()); g.lineTo(x + 2 + j(), y + h - 2 + j()); g.closePath(); g.fill(); x += w; } y += h; } grain(g, s, 22); }),
  dome: tex(512, (g, s) => { stones(g, s, '#7d6b57', ['#c8ad86', '#b99c77', '#d2b993', '#a88f72', '#bfa37f', '#9f8a70'], 420, [9, 16], [6, 10]); grain(g, s, 18); }),
  wood: tex(512, (g, s) => { const n = 6, pw = s / n; for (let i = 0; i < n; i++) { g.fillStyle = ['#8d5a33', '#9a6439', '#83532f', '#a06b3d', '#915d35', '#7f4f2c'][i]; g.fillRect(i * pw, 0, pw, s); g.strokeStyle = 'rgba(50,28,12,.35)'; for (let k = 0; k < 9; k++) { g.lineWidth = 1 + rnd() * 1.5; g.beginPath(); const x0 = i * pw + rnd() * pw; for (let y = 0; y <= s; y += 16) g.lineTo(x0 + Math.sin(y / 40 + k) * 3, y); g.stroke(); } g.fillStyle = 'rgba(30,16,6,.7)'; g.fillRect(i * pw, 0, 2, s); } grain(g, s, 14); }),
  floor: tex(512, (g, s) => { const n = 8, ph = s / n; for (let i = 0; i < n; i++) { g.fillStyle = ['#b88a5c', '#a97c51', '#c0946a', '#b08456', '#a77a4f', '#bb8f62', '#ad8053', '#b48759'][i]; g.fillRect(0, i * ph, s, ph); const off = rnd() * s; g.fillStyle = 'rgba(40,22,8,.5)'; g.fillRect(0, i * ph, s, 1.5); g.fillRect(off, i * ph, 1.5, ph); } grain(g, s, 12); }),
  paver: tex(512, (g, s) => { g.fillStyle = '#e3ded5'; g.fillRect(0, 0, s, s); g.strokeStyle = 'rgba(120,110,100,.25)'; for (let k = 0; k < 18; k++) { g.lineWidth = .6 + rnd(); g.beginPath(); let x = rnd() * s, y = rnd() * s; g.moveTo(x, y); for (let j = 0; j < 8; j++) { x += (rnd() - .4) * 60; y += (rnd() - .5) * 40; g.lineTo(x, y); } g.stroke(); } g.fillStyle = '#b9b2a6'; g.fillRect(0, 0, s, 3); g.fillRect(0, 0, 3, s); g.fillRect(0, s / 2, s, 3); g.fillRect(s / 2, 0, 3, s); grain(g, s, 8); }),
  slabs: tex(512, (g, s) => { g.fillStyle = '#6f6b66'; g.fillRect(0, 0, s, s); const rows = 4; for (let r = 0; r < rows; r++) { let x = -rnd() * 120; const h = s / rows; while (x < s) { const w = 90 + rnd() * 90; g.fillStyle = ['#a29d95', '#958f87', '#aca79f', '#8c877f', '#9b968e'][(rnd() * 5) | 0]; g.fillRect(x + 3, r * h + 3, w - 6, h - 6); x += w; } } grain(g, s, 18); }),
  cobble: tex(512, (g, s) => { stones(g, s, '#6d6862', ['#a39e96', '#928d86', '#b0aaa1', '#8a857e', '#9d978e'], 150, [20, 30], [16, 24]); grain(g, s, 16); }),
  tile: tex(256, (g, s) => { g.fillStyle = '#cfc9c0'; g.fillRect(0, 0, s, s); g.strokeStyle = '#8f877c'; g.lineWidth = 3; for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const x = i * s / 2, y = j * s / 2; g.strokeRect(x + 2, y + 2, s / 2 - 4, s / 2 - 4); g.beginPath(); g.arc(x + s / 4, y + s / 4, s / 7, 0, 7); g.stroke(); } grain(g, s, 10); }),
  grass: tex(512, (g, s) => { g.fillStyle = '#5c7a34'; g.fillRect(0, 0, s, s); for (let i = 0; i < 14000; i++) { g.strokeStyle = ['#6f8f3e', '#4f6c2b', '#7b9a48', '#58762f', '#86a352'][(rnd() * 5) | 0]; g.lineWidth = 1; const x = rnd() * s, y = rnd() * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 3, y - 3 - rnd() * 5); g.stroke(); } grain(g, s, 10); }),
  field: tex(512, (g, s) => { g.fillStyle = '#6d7f3f'; g.fillRect(0, 0, s, s); blotch(g, s, 260, ['#7d8c48', '#5f7336', '#8a8f52', '#6b7a3c', '#9a9459'], 8, 40, .22); grain(g, s, 14); }),
  dirt: tex(512, (g, s) => { g.fillStyle = '#8c7253'; g.fillRect(0, 0, s, s); blotch(g, s, 400, ['#7c6447', '#9a8061', '#6f5a40', '#a48a68'], 2, 14, .35); grain(g, s, 30); }),
  road: tex(512, (g, s) => { g.fillStyle = '#a48c6c'; g.fillRect(0, 0, s, s); blotch(g, s, 500, ['#937b5c', '#b39b79', '#8a7254', '#bba483'], 1, 8, .35); grain(g, s, 26); }),
};

T.dome.repeat.set(9, 2.5);
/* ============ MATERIALES ============ */
const solidMats = [];
function std(p, s = 1) { const base = p.opacity ?? 1; const { bump, ...pp } = p; const m = new THREE.MeshStandardMaterial({ ...pp, transparent: true }); if (bump) { m.bumpMap = p.map; m.bumpScale = bump; } m.userData.base = base; m.userData.s = s; solidMats.push(m); return m; }
const M = {
  stucco: std({ map: T.stucco, roughness: .92, bump: .6 }, 1.6),
  wallInt: std({ map: T.stuccoW, roughness: .9 }, 2),
  stone: std({ map: T.stone, roughness: .9, bump: 3 }, 1.1),
  dome: std({ map: T.dome, roughness: .93, bump: 3 }),
  woodDoor: std({ map: T.wood, roughness: .5, bump: 1 }, 1.2),
  floor: std({ map: T.floor, roughness: .6 }, 1.6),
  paver: std({ map: T.paver, roughness: .45 }, 1.2),
  cobble: std({ map: T.cobble, roughness: .9 }, 1.4),
  slabs: std({ map: T.slabs, roughness: .85, bump: 1.5 }, 2.4),
  tile: std({ map: T.tile, roughness: .5 }, .8),
  grass: std({ map: T.grass, roughness: 1 }, 2.2),
  metal: std({ color: '#2a2826', roughness: .45, metalness: .65 }),
  steel: std({ color: '#b9bcbf', roughness: .25, metalness: .9 }),
  glass: std({ color: '#a9bcc4', roughness: .04, metalness: .85, opacity: .42, depthWrite: false }),
  concrete: std({ color: '#cfc8bc', roughness: .85 }),
  darkWood: std({ color: '#5b3d27', roughness: .6 }),
  cabinet: std({ color: '#8a6042', roughness: .55 }),
  marble: std({ color: '#ece8e1', roughness: .25 }),
  ceramic: std({ color: '#f5f4f1', roughness: .2 }),
  sofa: std({ color: '#7b4a2c', roughness: .8 }),
  fabric: std({ color: '#9a958d', roughness: .9 }),
  linen: std({ color: '#ece7de', roughness: .9 }),
  rug: std({ color: '#5a6478', roughness: 1 }),
  leaf: std({ color: '#3d5f27', roughness: .85, flatShading: true }),
  leaf2: std({ color: '#557d34', roughness: .85, flatShading: true }),
  carW: std({ color: '#eceeef', roughness: .18, metalness: .35 }),
  carD: std({ color: '#1d2024', roughness: .18, metalness: .7 }),
  carS: std({ color: '#8d939a', roughness: .2, metalness: .85 }),
  carGl: std({ color: '#0e1316', roughness: .04, metalness: .9 }),
  tire: std({ color: '#141414', roughness: .9 }),
  rim: std({ color: '#3b3d40', roughness: .3, metalness: .9 }),
  led: std({ color: '#ffffff', emissive: '#e8f2ff', emissiveIntensity: 2.2 }),
  tail: std({ color: '#400', emissive: '#ff1a1a', emissiveIntensity: 1.6 }),
  ceilLamp: std({ color: '#fff', emissive: '#ffd9a8', emissiveIntensity: 2.6 }),
  lamp: std({ color: '#3a2c1c', emissive: '#ffb25e', emissiveIntensity: 3.2, roughness: .4 }),
  fire: std({ color: '#2a1408', emissive: '#ff8a32', emissiveIntensity: 3.2 }),
  soot: std({ color: '#151210', roughness: 1 }),
};
const edgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(2.4, 1.55, .7), transparent: true, toneMapped: false, depthWrite: false });
const glowMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(5, 3.2, 1.4), transparent: true, toneMapped: false, depthWrite: false });

/* ============ CONSTRUCTORES ============ */
const builds = [];
let PH = { a: 0, b: 1, dur: 1.2, ox: 0, oy: 0 };
function reg(o, px, py, t0) {
  o.userData.t0 = t0 ?? PH.a + clamp(Math.hypot(px - PH.ox, py - PH.oy) / 26) * (PH.b - PH.a);
  o.userData.dur = PH.dur; builds.push(o);
}
function edges(mesh, geo) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo || mesh.geometry, 28), edgeMat); l.renderOrder = 5; mesh.add(l); }
function worldUV(g, w, h, d, s) { const uv = g.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]]; for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * dims[f][0] / s, uv.getY(i) * dims[f][1] / s); } }
function B(x0, x1, y0, y1, z0, z1, mat, par, o = {}) {

function frameGlass(a, b, c0, c1, z0, z1, par, alongX) {

// muro a lo largo de X en la cota y del plano. ops: [a,b,z0,z1,tipo] tipo 'w' ventana, 'g' puerta de vidrio, 'd' vano
function wallX(x0, x1, y, t, z0, z1, mat, par, ops = []) {

function wallY(x, y0, y1, t, z0, z1, mat, par, ops = []) {

function group(par, x, y, z = 0, rot = 0) { const g = new THREE.Group(); g.position.set(W(x), z, Zc(y)); g.rotation.y = rot; par.add(g); reg(g, x, y); return g; }

  for (const p of pillars) { const k = clamp((t - p.t0) / 1.1); p.m.visible = k > 0; p.m.scale.y = Math.max(.0005, easeOut(k) * p.h); }
  const s = smooth(10.8, 14.6, t);
  for (const m of solidMats) { const op = (.012 + .988 * s) * m.userData.base; const tr = op < .999; if (m.opacity !== op) m.opacity = op; if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; } m.depthWrite = m === M.glass ? false : s > .5; }
  const cast = s > .3; if (cast !== lastCast) { lastCast = cast; root.traverse(o => { if (o.isMesh && o.userData.cast !== undefined) o.castShadow = cast && o.userData.cast; }); }
  edgeMat.opacity = .9 * (1 - smooth(12.6, 15.6, t)); edgeMat.visible = edgeMat.opacity > .01;
  glowMat.opacity = .85 * (1 - smooth(9.5, 12.8, t)); G.lines.visible = glowMat.opacity > .01;
  bloom.strength = THREE.MathUtils.lerp(.55, .2, smooth(11.5, 16, t));

  for (const [L, I] of lamps) L.intensity = I * smooth(13, 16, t);
  const open = smooth(27.6, 29.4, t) * 1.5; leafL.rotation.y = open; leafR.rotation.y = -open;   // abre la puerta principal
  let f = 0; for (const [a, m, b] of FADES) if (t > a && t < b) f = t < m ? smooth(a, m, t) : 1 - smooth(m, b, t);
  grade.uniforms.fade.value = f; grade.uniforms.seed.value = (t * 24) % 97;
  let html = '', op = 0;
  for (const [a, b, h, sub] of CAPS) if (t >= a && t <= b) { op = smooth(a, a + .5, t) * (1 - smooth(b - .5, b, t)); html = `<b>${h}</b>${sub}`; }
  if (capEl.innerHTML !== html) capEl.innerHTML = html; capEl.style.opacity = op;
  titleEl.style.opacity = smooth(66.4, 67.6, t);
}
function setCam(p, l) { camera.position.copy(p); camera.lookAt(l); }

/* ============ TAMAÑO ============ */
function resize() {
  const w = CAPTURE ? +(Q.get('w') || 720) : innerWidth, h = CAPTURE ? +(Q.get('h') || 1280) : innerHeight;
  renderer.setSize(w, h, !CAPTURE ? true : false); if (CAPTURE) { canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; }
  composer.setSize(w, h); camera.aspect = w / h; camera.fov = w / h < 1 ? 56 : 42; camera.updateProjectionMatrix();
}
resize(); addEventListener('resize', resize);
const shadowFrame = () => { sunL.target.position.set(0, 0, 0); };
shadowFrame();

/* ============ MODO CAPTURA (cuadro por cuadro) ============ */
window.__renderAt = (t) => { update(t); const [p, l] = camAt(t); setCam(p, l); composer.render(); return true; };
window.__END = END;
window.__ready = true;

/* ============ MODO INTERACTIVO ============ */
if (!CAPTURE) {
  const controls = new OrbitControls(camera, canvas); controls.enabled = false; controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .495; controls.minDistance = 2; controls.maxDistance = 90;
  let t0 = performance.now(), mode = 'play', fly = null;
  const VIEWS = {
    fachada: [[2.8, -9.8, 1.65], [9, 3, 3.0]], aerea: [[28, -14, 18], [10, 7.5, 1]], patio: [[11, 3.5, 4.2], [16, 12, 1.2]],
    pb: [[10, 4, 30], [10, 7.7, 0]], pa: [[10, 2, 32], [10, 8, 2]],
  };
  function showCut(v) { const lowOnly = v === 'pb', noRoof = v === 'pa' || lowOnly; G.pa.visible = !lowOnly; G.slab.visible = !lowOnly; G.roof.visible = !noRoof; G.salonRoof.visible = !noRoof; }
  document.getElementById('ui').addEventListener('click', e => {
    const v = e.target.dataset?.v; if (!v) return;
    if (v === 'play' || v === 'interior') { showCut(''); mode = 'play'; t0 = performance.now() - (v === 'interior' ? 26500 : 0); controls.enabled = false; return; }
    if (mode === 'play') update(END + 5);
    mode = 'free'; showCut(v); controls.enabled = true; titleEl.style.opacity = 0; capEl.style.opacity = 0;
    const [p, l] = VIEWS[v]; fly = { from: camera.position.clone(), to: toV(p), lf: controls.target.clone(), lt: toV(l), s: performance.now() };
  });
  renderer.setAnimationLoop(() => {
    if (mode === 'play') {
      const t = (performance.now() - t0) / 1000; update(t); const [p, l] = camAt(t); setCam(p, l);
      if (t > END + 1.5) { mode = 'free'; controls.enabled = true; controls.target.copy(l); }
    } else {
      if (fly) { const k = smooth(0, 1, (performance.now() - fly.s) / 1600); camera.position.lerpVectors(fly.from, fly.to, k); controls.target.lerpVectors(fly.lf, fly.lt, k); if (k >= 1) fly = null; }
      controls.update();
    }
    composer.render();
  });
}
