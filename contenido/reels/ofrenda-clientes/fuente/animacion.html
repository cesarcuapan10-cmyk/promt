<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(../fonts/Anton.ttf)}
@font-face{font-family:Caveat;src:url(../fonts/Caveat.ttf)}
@font-face{font-family:Fredoka;src:url(../fonts/Fredoka.ttf)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const MAIN=document.getElementById('c');
let ctx=MAIN.getContext('2d');
const PI=Math.PI;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const eback=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const mixCam=(a,b,k)=>({x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),s:lerp(a.s,b.s,k)});
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function withCtx(c,fn){const o=ctx;ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';fn();ctx=o}
const BUF=[mkCanvas(W,H),mkCanvas(W,H),mkCanvas(W,H)];

const C={cream:'#F5EFE6',orange:'#FF8C1A',pink:'#ff3d8b',purple:'#8a3cff',green:'#2ec27e',yellow:'#ffd23f',blue:'#2fa8ff',teal:'#1fb5a8'};

/* ---------- sprites ---------- */
function mkMarigold(seed,gold){const c=mkCanvas(80,80);const g=c.getContext('2d');const r=rng(seed);
  const cols=gold?['#ffd36b','#ffc23d','#ffe39a','#ffb020']:['#ff8c1a','#ffa21f','#ff7a00','#ffb733','#e8620a'];
  for(let k=0;k<90;k++){const a=r()*PI*2,d=Math.sqrt(r())*33;g.fillStyle=cols[(r()*cols.length)|0];g.beginPath();g.ellipse(40+Math.cos(a)*d,40+Math.sin(a)*d,7+r()*4,4.5+r()*3,a,0,7);g.fill()}
  const gr=g.createRadialGradient(32,30,3,40,40,40);gr.addColorStop(0,'rgba(255,240,170,.35)');gr.addColorStop(1,'rgba(110,25,0,.45)');
  g.globalCompositeOperation='source-atop';g.fillStyle=gr;g.fillRect(0,0,80,80);return c}
const MG=[1,2,3,4,5].map(i=>mkMarigold(i*977));
const MGG=[1,2,3].map(i=>mkMarigold(i*311,true));
function marigold(x,y,s,i){const m=MG[Math.abs(i|0)%MG.length];ctx.drawImage(m,x-s/2,y-s/2,s,s)}

const NOISE=[0,1,2,3].map(i=>{const c=mkCanvas(540,960);const g=c.getContext('2d');const d=g.createImageData(540,960);const r=rng(i*7919+3);
  for(let p=0;p<d.data.length;p+=4){const v=(r()*255)|0;d.data[p]=d.data[p+1]=d.data[p+2]=v;d.data[p+3]=255}g.putImageData(d,0,0);return c});

/* ---------- static altar geometry ---------- */
const CARDS=[{x:430,y:880,txt:['¿Precio?']},{x:540,y:880,txt:['Luego te','aviso']},{x:650,y:880,txt:['Vino','1 vez']}];
const CANDLES=[
 {x:540,y:1590,h:210,w:58,id:'C'},
 {x:350,y:880,h:80,w:30},{x:730,y:880,h:80,w:30},
 {x:300,y:1030,h:120,w:36},{x:780,y:1030,h:120,w:36},
 {x:200,y:1215,h:95,w:34},{x:880,y:1215,h:95,w:34},{x:300,y:1215,h:140,w:38},{x:780,y:1215,h:140,w:38},
 {x:250,y:1520,h:130,w:44},{x:830,y:1520,h:130,w:44},{x:380,y:1480,h:90,w:36},{x:700,y:1480,h:90,w:36},
 {x:150,y:1680,h:170,w:50},{x:930,y:1680,h:170,w:50}];
CANDLES.forEach((c,i)=>{c.d=Math.hypot(c.x-540,c.y-1590);c.i=i});
const ORD=[...CANDLES].sort((a,b)=>a.d-b.d);ORD.forEach((c,k)=>c.ord=k);

// marigold positions precomputed
const ARCH=[];{const r=rng(42);for(let k=0;k<=80;k++){const th=k/80*PI;const x=540+390*Math.cos(th),y=1200-660*Math.sin(th);
  ARCH.push([x+(r()-.5)*14,y+(r()-.5)*14,52+r()*14,k]);ARCH.push([x+(r()-.5)*30,y+(r()-.5)*30+18,40+r()*10,k+3])}
 for(let k=0;k<12;k++){ARCH.push([150+(r()-.5)*20,1200+k*20,50,k]);ARCH.push([930+(r()-.5)*20,1200+k*20,50,k+1])}}
const PATH=[];{const r=rng(7);for(let k=0;k<260;k++){const v=r();const y=1430+v*v*520;const half=60+(y-1430)*0.55;const x=540+(r()*2-1)*half;PATH.push([x,y,16+(y-1430)*0.05+r()*10,k])}PATH.sort((a,b)=>a[1]-b[1])}
const GARL=[];{const r=rng(99);
 const row=(x1,x2,y,n,s)=>{for(let k=0;k<=n;k++)GARL.push([lerp(x1,x2,k/n),y+(r()-.5)*6,s+r()*6,k])};
 row(330,750,885,12,30);row(250,830,1035,16,32);row(160,920,1220,20,36);
 for(let k=0;k<10;k++){GARL.push([175+r()*30,1150-k*12,40,k]);GARL.push([905-r()*30,1150-k*12,40,k+2])}}

/* ---------- primitives ---------- */
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function flame(x,y,s,t,seed,lean=0){
  const f=1+0.08*Math.sin(t*23+seed*3)+0.05*Math.sin(t*37+seed);
  const h=46*s*f,w=15*s;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean+0.05*Math.sin(t*11+seed));
  const g=ctx.createRadialGradient(0,-h*0.3,1,0,-h*0.35,h*0.8);
  g.addColorStop(0,'rgba(255,255,235,1)');g.addColorStop(.35,'rgba(255,220,120,1)');g.addColorStop(.7,'rgba(255,140,30,.9)');g.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-h);ctx.bezierCurveTo(w*1.1,-h*0.45,w,0,0,0);ctx.bezierCurveTo(-w,0,-w*1.1,-h*0.45,0,-h);ctx.fill();
  ctx.fillStyle='rgba(120,170,255,.55)';ctx.beginPath();ctx.ellipse(0,-h*0.08,w*0.35,h*0.12,0,0,7);ctx.fill();
  ctx.restore()}
function candleBody(c){const {x,y,h,w}=c;
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,'#cdb48a');g.addColorStop(.35,'#fbf0d6');g.addColorStop(1,'#bfa175');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-w/2,y-h,w,h,[w*0.3,w*0.3,4,4]);ctx.fill();
  ctx.fillStyle='#fff7e4';ctx.beginPath();ctx.ellipse(x-w*0.18,y-h+w*0.25,w*0.1,w*0.45,0,0,7);ctx.fill();
  ctx.strokeStyle='#2a1a10';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x,y-h-10);ctx.stroke()}
function text(str,x,y,size,col,font='Anton',align='center',opt={}){
  ctx.font=`${opt.weight||''} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(opt.max){const m=ctx.measureText(str).width;if(m>opt.max){size*=opt.max/m;ctx.font=`${opt.weight||''} ${size}px ${font}`}}
  if(opt.glow){ctx.shadowColor=opt.glow;ctx.shadowBlur=opt.blur||40}
  if(opt.stroke){ctx.lineWidth=opt.stroke;ctx.strokeStyle=opt.strokeCol||'rgba(0,0,0,.5)';ctx.lineJoin='round';ctx.strokeText(str,x,y)}
  ctx.fillStyle=col;ctx.fillText(str,x,y);ctx.shadowBlur=0;ctx.shadowColor='transparent';return size}
// animated title line: pops in at t0
function popLine(str,x,y,size,col,t,t0,opt={}){
  const k=seg(t,t0,t0+0.28);if(k<=0)return;
  const s=opt.slam?lerp(1.9,1,eo(k)):lerp(0.4,1,eback(k));
  ctx.save();ctx.globalAlpha*=clamp(k*3);ctx.translate(x,y);ctx.scale(s,s);
  text(str,0,0,size,col,'Anton','center',{max:opt.max||980,glow:opt.glow||'rgba(0,0,0,.85)',blur:opt.blur||30,stroke:opt.stroke});
  ctx.restore()}

/* ---------- papel picado ---------- */
function papel(t,yb,bright,cols){
  cols=cols||[C.pink,C.orange,C.purple,C.green,C.yellow,C.blue];
  ctx.save();ctx.strokeStyle=bright?'#7a5a3a':'#3a2a2a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-20,yb);ctx.quadraticCurveTo(540,yb+40,1100,yb);ctx.stroke();
  for(let k=0;k<9;k++){const x=20+k*125;const sag=40*(1-Math.pow((x-540)/560,2));const y=yb+sag*0.9;
    const sw=0.08*Math.sin(t*2.2+k*1.3);
    ctx.save();ctx.translate(x+52,y);ctx.rotate(sw);ctx.transform(1,0,0.08*Math.sin(t*3+k),1,0,0);
    ctx.fillStyle=cols[k%cols.length];ctx.globalAlpha=bright?0.95:0.9;
    ctx.beginPath();ctx.moveTo(-52,0);ctx.lineTo(52,0);ctx.lineTo(52,120);
    for(let z=0;z<=8;z++)ctx.lineTo(52-z*13,120+(z%2?14:0));ctx.closePath();ctx.fill();
    // cutouts
    ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(0,52,22,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';ctx.fillStyle=cols[k%cols.length];
    ctx.beginPath();ctx.arc(-8,48,6,0,7);ctx.arc(8,48,6,0,7);ctx.fill();ctx.fillRect(-10,62,20,5);
    ctx.globalCompositeOperation='destination-out';
    for(let d=0;d<4;d++){const dx=-36+d*24;ctx.beginPath();ctx.moveTo(dx,14);ctx.lineTo(dx+6,22);ctx.lineTo(dx,30);ctx.lineTo(dx-6,22);ctx.fill()}
    for(let d=0;d<5;d++){ctx.beginPath();ctx.arc(-40+d*20,96,4,0,7);ctx.fill()}
    ctx.globalCompositeOperation='source-over';ctx.restore()}
  ctx.restore()}

/* ---------- night sky ---------- */
const STARS=[];{const r=rng(5);for(let k=0;k<140;k++)STARS.push([r()*W,r()*H*0.75,r()*2.2+0.5,r()*6])}
function night(t,warm=0){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0518');g.addColorStop(.55,'#24093a');g.addColorStop(1,'#3d1238');
  ctx.fillStyle=g;ctx.fillRect(-W,-H,W*3,H*3);
  for(const s of STARS){ctx.globalAlpha=0.35+0.35*Math.sin(t*2+s[3]);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s[0],s[1],s[2],0,7);ctx.fill()}
  ctx.globalAlpha=1}

/* ---------- altar ---------- */
function litOf(c,t){
  let v=seg(t,0.33+c.ord*0.085,0.48+c.ord*0.085);
  const off=c.id==='C'?12.62:12.66+c.ord*0.02;
  if(t>=off)v=1-seg(t,off,off+0.1);
  const on2=24.35+c.ord*0.06;if(t>=on2)v=seg(t,on2,on2+0.15);
  return v}
function cardDraw(cd,i,t,glowK){
  ctx.save();ctx.translate(cd.x,cd.y);ctx.rotate([-0.05,0.02,0.06][i]);
  ctx.fillStyle='#3a2414';ctx.beginPath();ctx.roundRect(-55,-150,110,150,6);ctx.fill();
  ctx.fillStyle='#d9a441';ctx.beginPath();ctx.roundRect(-50,-145,100,140,4);ctx.fill();
  ctx.fillStyle='#f3e6c8';ctx.fillRect(-43,-138,86,126);
  ctx.fillStyle='#1d1410';ctx.font='700 30px Caveat';ctx.textAlign='center';ctx.textBaseline='middle';
  const L=cd.txt;L.forEach((s,j)=>ctx.fillText(s,0,-75+(j-(L.length-1)/2)*30));
  marigold(38,-140,30,i+2);
  if(glowK>0){ctx.globalCompositeOperation='lighter';glow(0,-75,160,'rgba(255,170,60,A)',0.55*glowK);ctx.globalCompositeOperation='source-over'}
  ctx.restore()}
function altar(t,cam,opt={}){
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(cam.s,cam.s);ctx.translate(-cam.x,-cam.y);
  night(t);
  // back wall glow
  let L=0;CANDLES.forEach(c=>L+=litOf(c,t));L/=CANDLES.length;
  ctx.globalCompositeOperation='lighter';glow(540,1150,900,'rgba(255,120,30,A)',0.35*L);ctx.globalCompositeOperation='source-over';
  // arch
  for(const m of ARCH)marigold(m[0],m[1],m[2],m[3]);
  // tiers
  const tier=(x1,x2,yt,yf,yb)=>{
    ctx.fillStyle='#6d2a7a';ctx.fillRect(x1-10,yt,x2-x1+20,yf-yt);
    const g=ctx.createLinearGradient(x1,0,x2,0);for(let k=0;k<=10;k++)g.addColorStop(k/10,k%2?'#3e1350':'#521a66');
    ctx.fillStyle=g;ctx.fillRect(x1,yf,x2-x1,yb-yf);
    ctx.fillStyle=C.pink;for(let x=x1;x<x2;x+=28){ctx.beginPath();ctx.arc(x+14,yb,14,0,PI);ctx.fill()}
    ctx.fillStyle='#ffe9f2';for(let x=x1;x<x2;x+=20){ctx.beginPath();ctx.arc(x+10,yf+2,8,0,PI);ctx.fill()}
  };
  tier(160,920,1205,1225,1430);tier(250,830,1020,1040,1205);tier(330,750,870,885,1020);
  // floor
  ctx.fillStyle='#1c0a22';ctx.fillRect(-200,1430,1480,700);
  for(const m of PATH)marigold(m[0],m[1],m[2],m[3]);
  // objects
  const pan=(x,y)=>{ctx.fillStyle='#b8682a';ctx.beginPath();ctx.ellipse(x,y-28,52,32,0,PI,0);ctx.fill();ctx.fillStyle='#8d4a1a';ctx.lineWidth=8;ctx.strokeStyle='#8d4a1a';ctx.beginPath();ctx.moveTo(x-35,y-30);ctx.quadraticCurveTo(x,y-70,x+35,y-30);ctx.stroke();ctx.beginPath();ctx.arc(x,y-58,9,0,7);ctx.fill();ctx.fillStyle='rgba(255,240,220,.6)';for(let k=0;k<14;k++){ctx.fillRect(x-40+((k*37)%80),y-40+((k*13)%20),3,3)}};
  pan(420,1040);pan(660,1040);
  const skull=(x,y,col)=>{ctx.fillStyle='#fbf6ee';ctx.beginPath();ctx.arc(x,y-42,30,0,7);ctx.fill();ctx.fillRect(x-18,y-24,36,22);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x-11,y-44,9,0,7);ctx.arc(x+11,y-44,9,0,7);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(x,y-34);ctx.lineTo(x-4,y-27);ctx.lineTo(x+4,y-27);ctx.fill();
    ctx.fillStyle=C.yellow;ctx.beginPath();ctx.arc(x,y-62,5,0,7);ctx.fill()};
  skull(430,1225,C.teal);skull(540,1225,C.pink);skull(650,1225,C.purple);
  for(const m of GARL)marigold(m[0],m[1],m[2],m[3]);
  CARDS.forEach((cd,i)=>cardDraw(cd,i,t,opt.cardGlow?opt.cardGlow(i):0));
  CANDLES.forEach(candleBody);
  if(opt.extra)opt.extra();
  // darkness
  ctx.fillStyle=`rgba(6,2,14,${0.8*(1-L)+0.1})`;ctx.fillRect(-W,-H,W*4,H*4);
  // flames + glows
  ctx.globalCompositeOperation='lighter';
  CANDLES.forEach(c=>{const v=litOf(c,t);if(v<=0.01)return;const fx=c.x,fy=c.y-c.h-6;
    glow(fx,fy-10,c.w*4.5,'rgba(255,150,50,A)',0.45*v);glow(fx,fy+c.h*0.4,c.w*2.2,'rgba(255,190,110,A)',0.18*v)});
  ctx.globalCompositeOperation='source-over';
  CANDLES.forEach(c=>{const v=litOf(c,t);if(v<=0.01)return;let lean=0,sc=c.w/36*v;
    if(c.id==='C'&&t>12.3&&t<12.7){lean=0.6*seg(t,12.3,12.6)*Math.sin(t*40);sc*=1-0.5*seg(t,12.45,12.62)}
    flame(c.x,c.y-c.h-6,sc,t,c.i,lean)});
  if(opt.over)opt.over();
  ctx.restore();return L}
function w2s(cam,x,y){return [(x-cam.x)*cam.s+W/2,(y-cam.y)*cam.s+H/2]}

/* ---------- characters ---------- */
const P1={skin:'#c98d5f',shirt:C.teal,pants:'#2c3e66',hair:'#2a1810',type:'m'};
const P2={skin:'#e0a982',shirt:C.pink,pants:'#5a2b6e',hair:'#3a1f14',type:'f'};
const P3={skin:'#b97b52',shirt:'#f5b82e',pants:'#3b3b4f',hair:'#1a1210',type:'cap',cap:'#d6452f'};
const P4={skin:'#d39a6c',shirt:'#e9e9ef',pants:'#2a2a3a',hair:'#111',type:'m',apron:'#2fa8ff'};
function person(x,y,s,o,t){
  ctx.save();ctx.translate(x,y);ctx.scale(s*(o.flip?-1:1),s);ctx.globalAlpha*=(o.alpha??1);
  const sw=o.walking?Math.sin(o.phase||0)*0.5:0;const bob=o.walking?Math.abs(Math.cos(o.phase||0))*8:0;
  ctx.translate(0,-bob);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,bob,70,14,0,0,7);ctx.fill();
  const leg=(hx,a)=>{ctx.save();ctx.translate(hx,-140);ctx.rotate(a);ctx.fillStyle=o.pants;ctx.beginPath();ctx.roundRect(-15,0,30,132,14);ctx.fill();
    ctx.fillStyle='#2a1a14';ctx.beginPath();ctx.ellipse(8,134,24,12,0,0,7);ctx.fill();ctx.restore()};
  leg(-18,sw);leg(18,-sw);
  const arm=(sx,a,front)=>{ctx.save();ctx.translate(sx,-262);ctx.rotate(a);ctx.strokeStyle=o.shirt;ctx.lineWidth=26;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,100);ctx.stroke();ctx.fillStyle=o.skin;ctx.beginPath();ctx.arc(0,112,15,0,7);ctx.fill();
    if(front&&o.bag){ctx.fillStyle=o.bag;ctx.beginPath();ctx.roundRect(-30,118,60,70,8);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,122,16,PI,0);ctx.stroke()}
    if(front&&o.phone){ctx.fillStyle='#111';ctx.beginPath();ctx.roundRect(-14,100,28,46,5);ctx.fill();ctx.fillStyle='#7fe3ff';ctx.fillRect(-10,104,20,36)}
    ctx.restore()};
  const wave=o.wave?(-2.7+0.45*Math.sin(t*13)):null;
  const cheer=o.cheer?(-2.6+0.25*Math.sin(t*10)):null;
  arm(-44,o.back?-sw*0.7+0.12:(cheer??(sw*0.7+0.12)),false);
  // body
  if(o.type==='f'){ctx.fillStyle=o.shirt;ctx.beginPath();ctx.moveTo(-40,-285);ctx.lineTo(40,-285);ctx.lineTo(60,-130);ctx.lineTo(-60,-130);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-56,-160,112,8)}
  else{ctx.fillStyle=o.shirt;ctx.beginPath();ctx.roundRect(-46,-290,92,160,[30,30,12,12]);ctx.fill();
    if(o.apron){ctx.fillStyle=o.apron;ctx.beginPath();ctx.roundRect(-34,-240,68,110,8);ctx.fill()}}
  arm(44,o.back?sw*0.7-0.12:(wave??cheer??(-sw*0.7-0.12)),true);
  // head
  ctx.fillStyle=o.skin;ctx.fillRect(-12,-305,24,22);
  ctx.beginPath();ctx.arc(-62,-360,13,0,7);ctx.arc(62,-360,13,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,-365,64,0,7);ctx.fill();
  ctx.fillStyle=o.hair;
  if(o.back){ctx.beginPath();ctx.arc(0,-368,62,0,7);ctx.fill();if(o.type==='f'){ctx.beginPath();ctx.arc(0,-438,26,0,7);ctx.fill()}
    if(o.type==='cap'){ctx.fillStyle=o.cap;ctx.beginPath();ctx.arc(0,-378,66,PI,0);ctx.fill()}}
  else{
    if(o.type==='f'){ctx.beginPath();ctx.arc(0,-372,68,PI*1.02,PI*1.98);ctx.fill();ctx.beginPath();ctx.arc(0,-440,28,0,7);ctx.fill();
      ctx.beginPath();ctx.ellipse(-58,-345,16,40,0.1,0,7);ctx.ellipse(58,-345,16,40,-0.1,0,7);ctx.fill()}
    else if(o.type==='cap'){ctx.fillStyle=o.cap;ctx.beginPath();ctx.arc(0,-380,66,PI,0);ctx.fill();ctx.beginPath();ctx.ellipse(30,-382,62,14,0,0,7);ctx.fill()}
    else{ctx.beginPath();ctx.arc(0,-378,66,PI*1.05,PI*1.95);ctx.fill();ctx.beginPath();ctx.ellipse(-20,-418,40,20,-0.3,0,7);ctx.fill()}
    const look=o.look||0;

    if(listMode){ctx.fillStyle='#16242b';ctx.fillRect(0,0,w,150);ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='600 46px Fredoka';ctx.fillText('Chats',40,100);
      const rows=[[P1,'Pidió precio','¿Precio?','hace 32 días'],[P2,'Luego te aviso','Luego te aviso :)','hace 3 meses'],[P3,'Vino 1 vez','Gracias, bye','hace 6 meses']];
      rows.forEach((r,i)=>{const k=seg(t,19.4+i*0.18,19.7+i*0.18);if(k<=0)return;const y=200+i*190;ctx.save();ctx.globalAlpha=k;ctx.translate((1-eo(k))*200,0);
        const gray=seg(t,20.6,21.4);ctx.filter=`grayscale(${gray})`;avatar(90,y+70,56,r[0]);ctx.filter='none';
        ctx.fillStyle='#fff';ctx.font='600 44px Fredoka';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(r[1],170,y+45);
        ctx.fillStyle='#8fa3ad';ctx.font='600 34px Fredoka';ctx.fillText(r[2],170,y+100);
        ctx.fillStyle=gray>0.5?'#ff6b6b':'#8fa3ad';ctx.textAlign='right';ctx.font='600 28px Fredoka';ctx.fillText(r[3],w-30,y+100);
        ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(170,y+165,w-200,2);ctx.restore()});
      cobweb(0,150,320,seg(t,20.4,21.6));cobweb(w,h,0,0);
      const ck=seg(t,20.9,21.5);cobweb(w,150,260,ck,true);
    }else{
      chatHeader(w,P2,'Luego te aviso','últ. vez hace 3 meses');
      bubble(30,220,'Luego te aviso :)',false,1,44);
      ctx.fillStyle='#8fa3ad';ctx.font='600 30px Fredoka';ctx.textAlign='center';ctx.fillText('— 3 meses después —',w/2,370);
      const msg='Hola, ¿cómo vas con lo que platicamos?';const n=Math.floor(seg(t,22.55,23.45)*msg.length);
      const sent=t>23.6;
      // input
      ctx.fillStyle='#16242b';ctx.fillRect(0,h-150,w,150);ctx.fillStyle='#22323a';ctx.beginPath();ctx.roundRect(24,h-125,w-170,96,48);ctx.fill();
      if(!sent){ctx.fillStyle='#fff';ctx.font='600 36px Fredoka';ctx.textAlign='left';ctx.textBaseline='middle';const s=msg.slice(0,n);
        ctx.save();ctx.beginPath();ctx.rect(40,h-125,w-200,96);ctx.clip();const tw=ctx.measureText(s).width;ctx.fillText(s+((t*3)%1<.5?'|':''),Math.min(56,w-210-tw),h-77);ctx.restore()}
      const press=seg(t,23.5,23.6)*(1-seg(t,23.6,23.75));ctx.save();ctx.translate(w-80,h-77);ctx.scale(1-0.2*press,1-0.2*press);ctx.fillStyle='#1fb57a';ctx.beginPath();ctx.arc(0,0,48,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(24,0);ctx.lineTo(-18,20);ctx.lineTo(-10,0);ctx.fill();ctx.restore();
      if(sent){const k=seg(t,23.6,23.8);ctx.font='600 32px Fredoka';bubble(w-30,440,'Hola, ¿cómo vas',true,k,42);bubble(w-30,550,'con lo que platicamos?',true,k,42);
        const blue=t>24.0;ctx.fillStyle=blue?'#4fc3ff':'#8fa3ad';ctx.font='600 28px Fredoka';ctx.textAlign='right';ctx.fillText('✓✓',w-40,670)}
    }});
  // spark flies up
  if(t>23.75&&t<24.6){const k=seg(t,23.75,24.4);const x=lerp(760,540,k),y=lerp(1000,200,eio(k));ctx.globalCompositeOperation='lighter';glow(x,y,120,'rgba(255,200,90,A)',0.9);
    for(let i=0;i<14;i++){glow(x+Math.sin(i*2.3+t*9)*40*(i/14),y+i*28,30,'rgba(255,170,60,A)',0.6*(1-i/14))}ctx.globalCompositeOperation='source-over'}
  if(listMode){popLine('NADIE LES DIO',540,230,140,C.cream,t,19.25);popLine('SEGUIMIENTO',540,380,160,C.orange,t,19.65,{glow:'rgba(255,120,20,.6)',blur:40});
    const u=eo(seg(t,20.0,20.5));if(u>0){ctx.fillStyle=C.orange;ctx.shadowColor=C.orange;ctx.shadowBlur=20;ctx.fillRect(540-400*u,470,800*u,10);ctx.shadowBlur=0}}
  else{popLine('REVÍVELOS:',540,230,150,C.orange,t,22.25,{glow:'rgba(255,120,20,.6)',blur:40});popLine('ESCRÍBELES HOY',540,390,140,C.cream,t,22.6)}
}

function sceneFinale(t){
  sceneAltar(t);
  goldSpiral(t,24.5);
  // burst at relight
  const b=seg(t,24.3,24.5)*(1-seg(t,24.5,25.1));if(b>0){ctx.globalCompositeOperation='lighter';glow(540,1100,1100,'rgba(255,190,90,A)',0.55*b);ctx.globalCompositeOperation='source-over'}
  if(t>25.4){
    ctx.save();const g=ctx.createLinearGradient(0,0,0,760);g.addColorStop(0,'rgba(5,2,12,.75)');g.addColorStop(1,'rgba(5,2,12,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,760);ctx.restore();
    popLine('COMENTA',540,300,170,C.cream,t,25.55);
    const k=seg(t,25.95,26.35);if(k>0){const pulse=1+0.04*Math.sin((t-26.4)*7)*seg(t,26.4,26.6);ctx.save();ctx.translate(540,500);ctx.scale(eback(k)*pulse,eback(k)*pulse);
      ctx.shadowColor=C.orange;ctx.shadowBlur=60+30*Math.sin(t*5);ctx.fillStyle=C.orange;ctx.beginPath();ctx.roundRect(-400,-105,800,210,105);ctx.fill();ctx.shadowBlur=0;
      // comment icon
      ctx.fillStyle='#1a0b10';ctx.beginPath();ctx.roundRect(-345,-48,92,76,22);ctx.fill();ctx.beginPath();ctx.moveTo(-325,24);ctx.lineTo(-345,58);ctx.lineTo(-295,26);ctx.fill();
      ctx.fillStyle=C.orange;for(let d=0;d<3;d++){ctx.beginPath();ctx.arc(-321+d*22,-10,7,0,7);ctx.fill()}
      text('“SISTEMA”',50,6,150,'#1a0b10','Anton');ctx.restore()}
    const bk=seg(t,26.8,27.3);if(bk>0){ctx.save();ctx.globalAlpha=bk;const gb=ctx.createLinearGradient(0,1700,0,1920);gb.addColorStop(0,'rgba(5,2,12,0)');gb.addColorStop(1,'rgba(5,2,12,.85)');ctx.fillStyle=gb;ctx.fillRect(0,1700,W,220);text('ENTIDAD VENDEDORA',540,1840,46,'rgba(245,239,230,.9)','Fredoka','center',{weight:600,glow:'rgba(0,0,0,.9)',blur:20});ctx.restore()}
  }
}

/* ---------- master ---------- */
function drawInto(i,fn,t){withCtx(BUF[i],()=>fn(t));return BUF[i]}
function render(t){
  ctx=MAIN.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  let shake=0;
  if(t<6.4){sceneAltar(t);
    // S2 phone overlay
    if(t>3.9&&t<6.4){const up=eo(seg(t,3.9,4.35))*(1-eio(seg(t,5.9,6.25)));const cy=lerp(2700,1400,up);
      phone(540,cy,640,1000,(w,h)=>{chatBg(w,h);const days=Math.floor(lerp(1,30,seg(t,4.8,5.8)));chatHeader(w,P1,'Pidió precio',`visto hace ${days} día${days>1?'s':''}`);
        bubble(30,230,'¿Precio?',false,seg(t,4.3,4.5),44);
        ctx.fillStyle='#8fa3ad';ctx.font='600 26px Fredoka';ctx.textAlign='left';if(t>4.55)ctx.fillText('8:14 pm',40,350);
        cobweb(w,170,240,seg(t,5.0,5.9),true);
        const sk=seg(t,4.75,4.95);if(sk>0){ctx.save();ctx.translate(w/2,560);ctx.rotate(-0.18);ctx.scale(lerp(2,1,eo(sk)),lerp(2,1,eo(sk)));ctx.globalAlpha=sk;
          ctx.strokeStyle='#ff4d4d';ctx.lineWidth=8;ctx.beginPath();ctx.roundRect(-230,-60,460,120,14);ctx.stroke();text('SIN RESPUESTA',0,4,62,'#ff4d4d','Anton');ctx.restore()}});
      if(t>4.75&&t<4.85)shake=10}
    if(t>3.55&&t<6.2)popLine('“¿PRECIO?”',540,230,150,C.cream,t,3.6,{glow:'rgba(0,0,0,.9)'});
    if(t<3.25){ctx.save();ctx.globalAlpha=1-seg(t,3.05,3.25);
      popLine('OFRENDA A LOS',540,225,115,C.cream,t,0.25);popLine('CLIENTES QUE',540,350,115,C.cream,t,0.55);
      popLine('DEJASTE IR',540,490,145,C.orange,t,0.95,{glow:'rgba(255,110,20,.75)',blur:50});ctx.restore()}
    // iris into bridge
    if(t>6.35){const cam=camAt(t);const [cx,cy]=w2s(cam,540,805);const r=eio(seg(t,6.35,6.85))*2300;
      const b=drawInto(0,sceneBridge,t);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();ctx.drawImage(b,0,0);ctx.restore();
      ctx.strokeStyle='rgba(255,180,80,.9)';ctx.lineWidth=10;ctx.shadowColor=C.orange;ctx.shadowBlur=30;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();ctx.shadowBlur=0}
  }
  else if(t<8.95){sceneBridge(t)}
  else if(t<9.85){sceneAltar(t);
    if(t<9.15){ctx.globalAlpha=1-seg(t,8.95,9.15);ctx.drawImage(drawInto(0,sceneBridge,t),0,0);ctx.globalAlpha=1}
    if(t>9.4){const cam=camAt(t);const [cx,cy]=w2s(cam,650,805);const r=eio(seg(t,9.4,9.8))*2300;const b=drawInto(0,sceneDoor,t);
      ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();ctx.drawImage(b,0,0);ctx.restore();
      ctx.strokeStyle='rgba(255,180,80,.9)';ctx.lineWidth=10;ctx.shadowColor=C.orange;ctx.shadowBlur=30;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();ctx.shadowBlur=0}}
  else if(t<11.3){sceneDoor(t)}
  else if(t<12.95){sceneAltar(t);petals(t,0.85,0.35);
    if(t<11.55){ctx.globalAlpha=1-seg(t,11.3,11.55);ctx.drawImage(drawInto(0,sceneDoor,t),0,0);ctx.globalAlpha=1}
    if(t>12.62&&t<12.66)shake=8}
  else if(t<13.3){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}
  else if(t<15.45){sceneRevelation(t);if(t<13.42)shake=22;else if(t>13.62&&t<13.78)shake=26;
    if(t>13.62&&t<13.69){ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(0,0,W,H)}}
  else if(t<19.0){sceneDay(t);if(t<15.62){ctx.fillStyle=`rgba(255,250,235,${1-seg(t,15.45,15.62)})`;ctx.fillRect(0,0,W,H)}}
  else if(t<24.3){scenePhone(t);if(t<19.3){ctx.globalAlpha=1-seg(t,19.0,19.3);ctx.drawImage(drawInto(0,sceneDay,t),0,0);ctx.globalAlpha=1}}
  else{sceneFinale(t);if(t<24.6){ctx.globalAlpha=1-seg(t,24.3,24.6);ctx.drawImage(drawInto(0,scenePhone,t),0,0);ctx.globalAlpha=1}}
  // title chips during flashbacks
  if(t>=6.6&&t<9.3){ctx.save();ctx.globalAlpha=seg(t,6.6,6.8)*(1-seg(t,8.95,9.15));popLine('“LUEGO TE AVISO”',540,280,135,C.cream,t,6.65);ctx.restore()}
  if(t>=9.75&&t<11.5){ctx.save();ctx.globalAlpha=1-seg(t,11.3,11.5);popLine('VINO 1 VEZ',540,280,170,C.cream,t,9.85);popLine('…Y NO REGRESÓ',540,430,90,C.orange,t,10.6);ctx.restore()}
  // shake
  if(shake){const img=drawInto(1,()=>ctx.drawImage(MAIN,0,0),t);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.drawImage(img,Math.sin(t*170)*shake,Math.cos(t*130)*shake)}
  // vignette
  const v=ctx.createRadialGradient(540,900,500,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  // grain
  ctx.globalAlpha=0.07;ctx.globalCompositeOperation='overlay';ctx.drawImage(NOISE[Math.floor(t*30)%4],0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
window.render=render;
Promise.all([document.fonts.load('100px Anton'),document.fonts.load('700 30px Caveat'),document.fonts.load('600 30px Fredoka')]).then(()=>{window.ready=true;const q=new URLSearchParams(location.search);if(q.get('t'))render(+q.get('t'))});
</script></body></html>
